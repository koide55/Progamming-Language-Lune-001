<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lune Playground</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css">
<style>
  :root {
    --bg: #1e1f26; --panel: #26272f; --border: #3a3b45;
    --fg: #e8e8ee; --dim: #9a9ab0; --accent: #7aa2f7;
    --err: #f7768e; --warn: #e0af68; --hint: #9ece6a; --help: #7dcfff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font-family: -apple-system, "Hiragino Sans", sans-serif; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--border);
           display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  header .sub { color: var(--dim); font-size: 12px; }
  header .nav { font-size: 12px; }
  header .nav a { color: var(--accent); text-decoration: none; }
  #status { margin-left: auto; font-size: 12px; color: var(--dim); }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
         padding: 10px 16px; height: calc(100vh - 46px); }
  .col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .toolbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  button, select, input[type=text] {
    background: var(--panel); color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: wait; }
  button.primary { background: var(--accent); color: #14141a; font-weight: 600; }
  input[type=text] { width: 90px; cursor: text; font-family: ui-monospace, monospace; }
  textarea, #output {
    flex: 1; width: 100%; background: var(--panel); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px; padding: 12px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px;
    line-height: 1.5; resize: none; white-space: pre; overflow: auto; margin: 0; }
  textarea:focus { outline: 1px solid var(--accent); }
  #output .e { color: var(--err); font-weight: 600; }
  #output .w { color: var(--warn); }
  #output .h { color: var(--hint); }
  #output .x { color: var(--help); }
  #output .tf { color: var(--accent); }
  #output .tm { color: var(--hint); }
  #output .tv { color: var(--dim); }
  #output a.diag { color: inherit; text-decoration: underline dotted; cursor: pointer; }
  label { font-size: 12px; color: var(--dim); }
  /* right-column tabs: 出力 / REPL */
  .tabs { gap: 4px; }
  .tabfill { flex: 1; }
  button.tab { border-radius: 6px 6px 0 0; border-bottom-color: transparent;
    color: var(--dim); padding: 6px 14px; }
  button.tab.active { color: var(--fg); border-color: var(--accent); }
  #repl { flex: 1; display: flex; flex-direction: column; min-height: 0;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
  /* an author `display` beats the UA rule for [hidden], so restate it */
  #repl[hidden] { display: none; }
  #repl-log { flex: 1; margin: 0; padding: 12px; overflow: auto; white-space: pre-wrap;
    word-break: break-word; background: none; border: none;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; line-height: 1.5; }
  #repl-log .e { color: var(--err); font-weight: 600; }
  #repl-log .w { color: var(--warn); }
  #repl-log .h { color: var(--hint); }
  #repl-log .x { color: var(--help); }
  #repl-log .tf { color: var(--accent); }
  #repl-log .tm { color: var(--hint); }
  #repl-log .tv { color: var(--dim); }
  #repl-log .echo { color: var(--dim); }
  #repl-log a.diag { color: inherit; text-decoration: underline dotted; cursor: pointer; }
  .repl-input { display: flex; align-items: center; gap: 8px;
    border-top: 1px solid var(--border); padding: 8px 12px; }
  #repl-prompt { color: var(--accent); font-family: ui-monospace, monospace; font-size: 13px; }
  #repl-line { flex: 1; width: auto; background: none; border: none; color: var(--fg);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; padding: 0; }
  #repl-line:focus { outline: none; }
  /* CodeMirror: match the page palette */
  .CodeMirror { flex: 1; height: auto; background: var(--panel); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; line-height: 1.5; }
  .CodeMirror-gutters { background: var(--panel); border-right: 1px solid var(--border); }
  .CodeMirror-linenumber { color: var(--dim); }
  .CodeMirror-cursor { border-left: 1px solid var(--fg); }
  .CodeMirror-selected { background: rgba(122, 162, 247, 0.18); }
  .CodeMirror-focused .CodeMirror-selected { background: rgba(122, 162, 247, 0.25); }
  .cm-s-default .cm-keyword { color: var(--accent); }
  .cm-s-default .cm-string { color: var(--hint); }
  .cm-s-default .cm-comment { color: var(--dim); }
  .cm-s-default .cm-number { color: var(--warn); }
  .cm-s-default .cm-atom { color: var(--warn); }
  .cm-s-default .cm-variable-2 { color: var(--help); }
  .cm-s-default .cm-operator { color: var(--fg); }
  .cm-error-line { background: rgba(247, 118, 142, 0.14); }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; height: auto; }
    textarea, #output, .CodeMirror, #repl { min-height: 40vh; } }
</style>
</head>
<body>
<header>
  <h1>Lune Playground</h1>
  <span class="sub">ブラウザの中の部室 — 処理系(Pure Python)を Pyodide 上でそのまま実行</span>
  <span class="nav"><a href="../">トップ</a> · <a href="errors.html">診断カタログ</a></span>
  <span id="status">Pyodide を読み込み中…</span>
</header>
<main>
  <div class="col">
    <div class="toolbar">

      <select id="preset">

      <button id="btn-check" disabled>型チェック</button>
      <button id="btn-fmt" disabled>整形 (fmt)</button>
      <button id="btn-fix" disabled>自動修正 (fix)</button>

      <button id="btn-explain" disabled>explain</button>

      <button id="btn-repl-reset" class="repl-only" disabled>リセット</button>
    </div>
    <pre id="output">(処理系を読み込んでいます — 初回のみ数秒かかります)</pre>
    <div id="repl" hidden>
      <pre id="repl-log"></pre>
      <div class="repl-input">
        <span id="repl-prompt">lune&gt;</span>
        <input type="text" id="repl-line" spellcheck="false" autocomplete="off"
               placeholder="式や宣言を入力して Enter（↑↓ で履歴）" disabled>
      </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/mode/simple.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
const PRESETS = {
  basics: {
    binding: "total",
    code: `let numbers = range(1, 10)
let doubled = map(numbers, fn x: Int -> x * 2)
let evens = filter(doubled, fn x: Int -> x % 4 == 0)
let total = fold(evens, 0, fn acc: Int x: Int -> acc + x)
`,
  },
  exhaustive: {
    binding: "",
    code: `type Color =
    | Red
    | Green
    | Blue

def name(c: Color): String =
    match c:
        | Red -> "red"
        | Green -> "green"
`,
  },
  typo: {
    binding: "total",
    code: `let count = 10
let total = cont + 5
`,
  },
  stream: {
    binding: "firstThree",
    trace: true,
    code: `let nat = naturalsFrom(1)
let evens = filter(nat, fn x: Int -> x % 2 == 0)
let firstThree = take(evens, 3)
`,
  },
};

const LUNE_FILES = ["__init__.py","cli.py","diagnostics.py","evaluator.py",
  "explanations.py","explanations_ja.py","fixer.py","formatter.py","layout.py",
  "lexer.py","messages.py","module_loader.py","nodes.py","parser.py","repl.py",
  "tokens.py","typechecker.py"];

const DRIVER = `
import io, json, sys, contextlib
sys.path.insert(0, "/app")

from lune.diagnostics import SourceMap, format_diagnostic, format_exception
from lune.module_loader import check_file, eval_file
from lune.evaluator import format_value, set_trace_hook
from lune.messages import set_language
from lune.explanations import render_explanation, available_codes
from lune.formatter import format_source
from lune.fixer import apply_fixes
from lune.repl import ReplSession, wants_more

ENTRY = "/app/main.lune"

def _write(source):
    with open(ENTRY, "w", encoding="utf-8") as f:
        f.write(source)

def lune_check(source, lang="en"):
    set_language(lang)
    _write(source)
    sm = SourceMap()
    out = io.StringIO()
    try:
        env = check_file(ENTRY, [], sm)
        for w in env.warnings:
            out.write(format_diagnostic(w, sm, explain_hint=True) + "\\n")
        out.write("type check OK\\n")
    except Exception as exc:
        out.write(format_exception(exc, sm, explain_hint=True) + "\\n")
    return out.getvalue()

def lune_run(source, binding, trace=False, lang="en"):
    set_language(lang)
    _write(source)
    sm = SourceMap()
    out = io.StringIO()
    try:
        env = check_file(ENTRY, [], sm)
        for w in env.warnings:
            out.write(format_diagnostic(w, sm, explain_hint=True) + "\\n")
    except Exception as exc:
        out.write(format_exception(exc, sm, explain_hint=True) + "\\n")
        return out.getvalue()
    trace_lines = []
    if trace:
        set_trace_hook(lambda depth, message: trace_lines.append("  " * depth + message))
    try:
        with contextlib.redirect_stdout(out):
            env = eval_file(ENTRY, [], sm)
            binding = binding.strip()
            if binding:
                out.write(format_value(env.lookup_raw(binding)) + "\\n")
            else:
                out.write("(評価完了 — 束縛名を指定すると値を表示します)\\n")
    except Exception as exc:
        out.write(format_exception(exc, sm, explain_hint=True) + "\\n")
    finally:
        if trace:
            set_trace_hook(None)
    if trace_lines:
        return "\\n".join(trace_lines) + "\\n" + "-" * 40 + "\\n" + out.getvalue()
    return out.getvalue()

def lune_fmt(source, lang="en"):
    set_language(lang)
    try:
        return json.dumps({"ok": True, "text": format_source(source, "main.lune")})
    except Exception as exc:
        sm = SourceMap()
        sm.add("main.lune", source)
        return json.dumps({"ok": False, "text": format_exception(exc, sm, explain_hint=True)})

def lune_fix(source, lang="en"):
    set_language(lang)
    try:
        fixed, applied = apply_fixes(source, "main.lune")
        return json.dumps({"ok": True, "text": fixed, "applied": applied})
    except Exception as exc:
        sm = SourceMap()
        sm.add("main.lune", source)
        return json.dumps({"ok": False, "text": format_exception(exc, sm, explain_hint=True)})

def lune_explain(code, lang="en"):
    set_language(lang)
    code = code.strip()
    text = render_explanation(code, lang)
    if text is None:
        return "診断コード %r の解説はありません\\n利用可能: %s" % (code, ", ".join(available_codes()))
    return text

# --- REPL ---------------------------------------------------------------
# Drives lune.repl.ReplSession directly. repl_main is the terminal front end
# (it owns the prompt loop and readline); the browser owns those instead, so
# only the session, the SourceMap and the <repl:N> numbering are mirrored here.

_REPL = {"session": None, "sm": None, "n": 0}

def lune_repl_reset(lang="en"):
    set_language(lang)
    _REPL["session"] = ReplSession()
    _REPL["sm"] = SourceMap()
    _REPL["n"] = 0
    return json.dumps({"kind": "banner", "text": "Lune v0.1 REPL — :help でコマンド一覧"})

def lune_repl_wants_more(line):
    # same rule as the terminal REPL, not a reimplementation
    return wants_more(line)

def lune_repl_submit(source, lang="en"):
    set_language(lang)
    if _REPL["session"] is None:
        lune_repl_reset(lang)
    _REPL["n"] += 1
    filename = "<repl:%d>" % _REPL["n"]
    _REPL["sm"].add(filename, source)
    out = io.StringIO()
    try:
        # print/println inside the submitted code writes to stdout
        with contextlib.redirect_stdout(out):
            result = _REPL["session"].submit(source, filename)
        for w in result.warnings:
            out.write(format_diagnostic(w, _REPL["sm"], explain_hint=True) + "\\n")
        if result.kind != "empty" and result.message:
            out.write(result.message + "\\n")
        return json.dumps({"kind": result.kind, "text": out.getvalue()})
    except Exception as exc:
        out.write(format_exception(exc, _REPL["sm"], explain_hint=True) + "\\n")
        return json.dumps({"kind": "error", "text": out.getvalue()})
`;

const $ = (id) => document.getElementById(id);
const output = $("output"), status = $("status");
let py = null;
let cm = null;

function setStatus(msg) { status.textContent = msg; }

// --- editor (CodeMirror with a plain-textarea fallback) ---------------------

function initEditor() {
  if (typeof CodeMirror === "undefined") return; // CDN unavailable: keep the textarea
  CodeMirror.defineSimpleMode("lune", {
    start: [
      { regex: /###/, token: "comment", next: "blockComment" },
      { regex: /#.*/, token: "comment" },
      { regex: /"(?:[^\\"]|\\.)*"?/, token: "string" },
      { regex: /'(?:[^\\']|\\.)'/, token: "string" },
      { regex: /\b(?:let|var|def|type|record|match|if|then|elif|else|fn|lazy|force|strict|seq|deepForce|while|for|in|import|module|IO)\b/, token: "keyword" },
      { regex: /\b(?:true|false|null)\b/, token: "atom" },
      { regex: /\b\d+(?:\.\d+)?\b/, token: "number" },
      { regex: /\b[A-Z][\w]*\b/, token: "variable-2" },
      { regex: /\|>|->|\?\?|\?\.|==|!=|<=|>=|[+\-*\/%=<>!|&?]/, token: "operator" },
    ],
    blockComment: [
      { regex: /.*?###/, token: "comment", next: "start" },
      { regex: /.*/, token: "comment" },
    ],
    meta: { lineComment: "#" },
  });
  cm = CodeMirror.fromTextArea($("editor"), {
    mode: "lune",
    lineNumbers: true,
    indentUnit: 4,
    viewportMargin: Infinity,
  });
}

function getCode() { return cm ? cm.getValue() : $("editor").value; }
function setCode(text) { cm ? cm.setValue(text) : ($("editor").value = text); }

let errorLine = null;
function clearErrorLine() {
  if (cm && errorLine !== null) cm.removeLineClass(errorLine, "background", "cm-error-line");
  errorLine = null;
}
function markErrorLineFrom(text) {
  clearErrorLine();
  if (!cm) return;
  const m = text.match(/main\.lune:(\d+):\d+/);
  if (!m) return;
  errorLine = Number(m[1]) - 1;
  cm.addLineClass(errorLine, "background", "cm-error-line");
}

// --- output ------------------------------------------------------------------

function colorize(text) {
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const linkCodes = (s) => s.replace(/\b([A-Z]{3}\d{4})\b/g, '<a class="diag" data-code="$1" title="クリックで explain">$1</a>');
  return text.split("\n").map((line) => {
    let cls = "";
    if (/^error\[/.test(line)) cls = "e";
    else if (/^warning\[/.test(line)) cls = "w";
    else if (/^\s*= hint:/.test(line)) cls = "h";
    else if (/^\s*= help:/.test(line)) cls = "x";
    else if (/^\s*force /.test(line)) cls = "tf";
    else if (/^\s*memo /.test(line)) cls = "tm";
    else if (/^\s*=> /.test(line)) cls = "tv";
    const html = linkCodes(esc(line));
    return cls ? `<span class="${cls}">${html}</span>` : html;
  }).join("\n");
}

function render(text) { output.innerHTML = colorize(text); }

// --- REPL --------------------------------------------------------------------

const repl = {
  buffer: [],      // lines of an unfinished multi-line entry
  history: [],     // submitted entries, oldest first
  cursor: 0,       // index into history; === length means "the live line"
  draft: "",       // the line being typed, stashed while browsing history
  ended: false,    // :quit was accepted; input stays closed until リセット
};

function replEcho(prompt, text) {
  replAppend(`<span class="echo">${prompt} </span>${colorize(text)}\n`);
}

function replAppend(html) {
  const log = $("repl-log");
  log.insertAdjacentHTML("beforeend", html);
  log.scrollTop = log.scrollHeight;
}

function replPrompt() {
  $("repl-prompt").textContent = repl.buffer.length ? "..." : "lune>";
}

function replReset(call, lang) {
  const banner = JSON.parse(call("lune_repl_reset", lang));
  repl.buffer = [];
  repl.ended = false;
  $("repl-log").innerHTML = "";
  replAppend(colorize(banner.text) + "\n");
  $("repl-line").disabled = false;
  replPrompt();
  $("repl-line").focus();
}

function replSubmit(call, lang, source) {
  const r = JSON.parse(call("lune_repl_submit", source, lang));
  if (r.text) replAppend(colorize(r.text));
  if (r.kind === "quit") {
    repl.ended = true;
    $("repl-line").disabled = true;
    replAppend(`<span class="echo">(セッション終了 — 「リセット」で再開できます)</span>\n`);
  }
}

// Enter: buffer the line if it opens a block, otherwise submit. A blank line
// closes an open block — the same rule the terminal REPL uses.
function replOnEnter(call, lang) {
  if (repl.ended) return;
  const line = $("repl-line").value;
  $("repl-line").value = "";
  replEcho(repl.buffer.length ? "..." : "lune>", line);

  if (repl.buffer.length) {
    if (line.trim()) { repl.buffer.push(line); replPrompt(); return; }
  } else if (!line.trim()) {
    return;
  } else if (call("lune_repl_wants_more", line)) {
    repl.buffer.push(line);
    replPrompt();
    return;
  }

  const source = repl.buffer.length ? repl.buffer.join("\n") : line;
  repl.buffer = [];
  replPrompt();
  repl.history.push(source);
  repl.cursor = repl.history.length;
  replSubmit(call, lang, source);
}

function replOnHistory(dir) {
  const input = $("repl-line");
  if (!repl.history.length) return;
  if (repl.cursor === repl.history.length) repl.draft = input.value;
  const next = repl.cursor + dir;
  if (next < 0 || next > repl.history.length) return;
  repl.cursor = next;
  // a multi-line entry comes back as one line so it can be edited and resent
  input.value = next === repl.history.length ? repl.draft : repl.history[next].replace(/\n/g, " ");
  input.setSelectionRange(input.value.length, input.value.length);
}

// --- presets / share links ---------------------------------------------------

function loadPreset(name) {
  setCode(PRESETS[name].code);
  $("binding").value = PRESETS[name].binding;
  $("trace").checked = Boolean(PRESETS[name].trace);
  clearErrorLine();
}

function encodeState() {
  const state = { c: getCode(), b: $("binding").value, t: $("trace").checked, l: $("lang").value };
  const utf8 = unescape(encodeURIComponent(JSON.stringify(state)));
  return btoa(utf8).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function decodeState(hash) {
  try {
    const b64 = hash.replace(/-/g, "+").replace(/_/g, "/");
    return JSON.parse(decodeURIComponent(escape(atob(b64))));
  } catch {
    return null;
  }
}

function applySharedState() {
  const m = location.hash.match(/^#s=(.+)$/);
  if (!m) return false;
  const state = decodeState(m[1]);
  if (!state || typeof state.c !== "string") return false;
  setCode(state.c);
  $("binding").value = state.b ?? "";
  $("trace").checked = Boolean(state.t);
  if (state.l === "en" || state.l === "ja") $("lang").value = state.l;
  return true;
}

// --- wiring --------------------------------------------------------------------

async function timed(label, fn) {
  const t0 = performance.now();
  const result = await fn();
  setStatus(`${label}: ${Math.round(performance.now() - t0)} ms`);
  return result;
}

async function main() {
  initEditor();
  if (!applySharedState()) loadPreset("basics");
  $("preset").addEventListener("change", (e) => loadPreset(e.target.value));

  $("btn-share").onclick = () => {
    history.replaceState(null, "", "#s=" + encodeState());
    navigator.clipboard?.writeText(location.href);
    setStatus("共有リンクをコピーしました");
  };
  $("btn-share").disabled = false;

  const explainOnClick = (e) => {
    const code = e.target?.dataset?.code;
    if (!code || !py) return;
    $("explain-code").value = code;
    showTab("output");
    $("btn-explain").onclick();
  };
  output.addEventListener("click", explainOnClick);
  $("repl-log").addEventListener("click", explainOnClick);

  function showTab(which) {
    const isRepl = which === "repl";
    $("output").hidden = isRepl;
    $("repl").hidden = !isRepl;
    $("tab-output").classList.toggle("active", !isRepl);
    $("tab-repl").classList.toggle("active", isRepl);
    if (isRepl && !repl.ended) $("repl-line").focus();
  }
  $("tab-output").onclick = () => showTab("output");
  $("tab-repl").onclick = () => showTab("repl");

  const t0 = performance.now();
  py = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/" });
  const tPyodide = Math.round(performance.now() - t0);

  py.FS.mkdirTree("/app/lune");
  const t1 = performance.now();
  await Promise.all(LUNE_FILES.map(async (f) => {
    const res = await fetch(`../lune/${f}`, { cache: "no-cache" });
    if (!res.ok) throw new Error(`fetch failed: lune/${f}`);
    py.FS.writeFile(`/app/lune/${f}`, await res.text());
  }));
  py.runPython(DRIVER);
  const tLune = Math.round(performance.now() - t1);

  setStatus(`起動完了 — Pyodide ${tPyodide} ms + Lune ${tLune} ms (Python ${py.runPython("import sys; sys.version.split()[0]")})`);
  render("処理系の準備ができました。「▶ 実行」(Ctrl/Cmd+Enter)を押してください。\n");

  const call = (name, ...args) => py.globals.get(name)(...args);

  $("btn-run").onclick = () => timed("実行", async () => {
    const text = call("lune_run", getCode(), $("binding").value, $("trace").checked, $("lang").value);
    render(text);
    markErrorLineFrom(text);
  });
  $("btn-check").onclick = () => timed("型チェック", async () => {
    const text = call("lune_check", getCode(), $("lang").value);
    render(text);
    markErrorLineFrom(text);
  });
  $("btn-fmt").onclick = () => timed("整形", async () => {
    const r = JSON.parse(call("lune_fmt", getCode(), $("lang").value));
    if (r.ok) { setCode(r.text); clearErrorLine(); render("(整形しました)\n"); } else render(r.text);
  });
  $("btn-fix").onclick = () => timed("自動修正", async () => {
    const r = JSON.parse(call("lune_fix", getCode(), $("lang").value));
    if (r.ok) { setCode(r.text); clearErrorLine(); render(`(自動修正: ${r.applied} 件適用)\n`); } else render(r.text);
  });
  $("btn-explain").onclick = () => timed("explain", async () =>
    render(call("lune_explain", $("explain-code").value || "TYP0007", $("lang").value)));

  // --- REPL wiring ---
  const lang = () => $("lang").value;
  replReset(call, lang());
  $("repl").hidden = true;          // replReset focuses the input; start on 出力

  $("repl-line").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); timed("REPL", async () => replOnEnter(call, lang())); }
    else if (e.key === "ArrowUp") { e.preventDefault(); replOnHistory(-1); }
    else if (e.key === "ArrowDown") { e.preventDefault(); replOnHistory(1); }
  });
  $("btn-repl-reset").onclick = () => replReset(call, lang());
  $("btn-repl-load").onclick = () => timed("REPL に読み込み", async () => {
    showTab("repl");
    if (repl.ended) replReset(call, lang());
    const source = getCode().replace(/\n+$/, "");
    if (!source.trim()) return;
    replEcho("lune>", "(エディタの内容)");
    replSubmit(call, lang(), source);
  });
  // the session was built with the language selected at load time
  $("lang").addEventListener("change", () => replReset(call, lang()));

  if (cm) {
    cm.setOption("extraKeys", {
      "Ctrl-Enter": () => $("btn-run").onclick(),
      "Cmd-Enter": () => $("btn-run").onclick(),
    });
  }

  for (const id of ["btn-run","btn-check","btn-fmt","btn-fix","btn-explain",
                    "btn-repl-load","btn-repl-reset"])
    $(id).disabled = false;
}

main().catch((e) => { render(`起動に失敗しました:\n${e}`); setStatus("エラー"); });
</script>
</body>
</html>
